<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-label="SpectreMotion — Under Construction">
  <title>SpectreMotion — Under Construction</title>
  <defs>
    <clipPath id="card">
      <rect width="900" height="320" rx="18"/>
    </clipPath>
    <pattern id="hazard" width="40" height="24" patternUnits="userSpaceOnUse">
      <rect width="40" height="24" fill="#f5b301"/>
      <polygon points="0,24 12,0 32,0 20,24" fill="#111418"/>
    </pattern>
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#fde047"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx=".15" cy=".5" r=".6">
      <stop offset="0" stop-color="#f5b301" stop-opacity=".18"/>
      <stop offset="1" stop-color="#f5b301" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="track">
      <rect x="270" y="212" width="560" height="12" rx="6"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <!-- Background -->
    <rect width="900" height="320" fill="#0d1117"/>
    <rect width="900" height="320" fill="url(#glow)"/>

    <!-- Hazard tape (top & bottom), scrolling -->
    <g>
      <rect x="-40" y="0" width="980" height="22" fill="url(#hazard)"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="40 0" dur="1.2s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="-40" y="298" width="980" height="22" fill="url(#hazard)"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-40 0" dur="1.2s" repeatCount="indefinite"/>
    </g>

    <!-- Big gear -->
    <g>
      <circle cx="140" cy="150" r="36" fill="none" stroke="#f5b301" stroke-width="10" stroke-dasharray="9.42 9.42"/>
      <circle cx="140" cy="150" r="31" fill="#f5b301"/>
      <circle cx="140" cy="150" r="19" fill="none" stroke="#0d1117" stroke-width="3" stroke-dasharray="6 4"/>
      <circle cx="140" cy="150" r="10" fill="#0d1117"/>
      <animateTransform attributeName="transform" type="rotate" from="0 140 150" to="360 140 150" dur="6s" repeatCount="indefinite"/>
    </g>

    <!-- Small gear (counter-rotating, 12:8 ratio) -->
    <g>
      <circle cx="180" cy="188" r="22" fill="none" stroke="#fde047" stroke-width="8" stroke-dasharray="8.64 8.64"/>
      <circle cx="180" cy="188" r="18" fill="#fde047"/>
      <circle cx="180" cy="188" r="6" fill="#0d1117"/>
      <animateTransform attributeName="transform" type="rotate" from="0 180 188" to="-360 180 188" dur="4s" repeatCount="indefinite"/>
    </g>

    <!-- Sparks -->
    <g fill="#fde047">
      <circle cx="205" cy="118" r="2.5">
        <animate attributeName="opacity" values="0;1;0" dur="1.4s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="128;104" dur="1.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="96" cy="210" r="2">
        <animate attributeName="opacity" values="0;1;0" dur="1.8s" begin=".5s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="214;192" dur="1.8s" begin=".5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="222" cy="214" r="1.8">
        <animate attributeName="opacity" values="0;1;0" dur="1.6s" begin=".9s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="220;200" dur="1.6s" begin=".9s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Text -->
    <text x="270" y="92" fill="#8b949e" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="14" letter-spacing="4">SPECTREMOTION</text>
    <text x="268" y="142" fill="#f5b301" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="46" font-weight="800" letter-spacing="2">
      UNDER CONSTRUCTION
      <animate attributeName="fill-opacity" values="1;.75;1" dur="2.4s" repeatCount="indefinite"/>
    </text>
    <text x="270" y="182" fill="#c9d1d9" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="18">Sedang dibangun ulang. Versi baru segera hadir.</text>

    <!-- Progress bar -->
    <rect x="270" y="212" width="560" height="12" rx="6" fill="#21262d"/>
    <g clip-path="url(#track)">
      <rect x="270" y="212" height="12" rx="6" fill="url(#bar)" width="40">
        <animate attributeName="width" values="40;220;200;390;360;520;40" keyTimes="0;.2;.3;.55;.65;.9;1" dur="7s" repeatCount="indefinite"/>
      </rect>
      <rect x="170" y="212" width="90" height="12" fill="url(#shine)">
        <animate attributeName="x" values="170;840" dur="2.2s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Status line -->
    <text x="270" y="256" fill="#8b949e" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="14">
      <tspan fill="#3fb950">$</tspan> building<tspan>.<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.25;.75;1" dur="1.5s" repeatCount="indefinite"/></tspan><tspan>.<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.25;.5;.75;1" dur="1.5s" repeatCount="indefinite"/></tspan><tspan>.<animate attributeName="opacity" values="0;0;1;0" keyTimes="0;.5;.75;1" dur="1.5s" repeatCount="indefinite"/></tspan>
      <tspan fill="#f5b301">▌<animate attributeName="opacity" values="1;0;1" dur="1s" calcMode="discrete" repeatCount="indefinite"/></tspan>
    </text>
  </g>

  <rect x=".5" y=".5" width="899" height="319" rx="18" fill="none" stroke="#30363d"/>
</svg>
