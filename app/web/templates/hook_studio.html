<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hook Studio — SpectreMotion</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script>document.documentElement.classList.add('js');</script>
  <style>
    .studio-layout { display: grid; grid-template-columns: 1fr 320px; gap: 20px; align-items: start; }
    @media (max-width: 900px) { .studio-layout { grid-template-columns: 1fr; } }
    .preview-card { position: sticky; top: 88px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .preview-frame { width: 100%; max-width: 260px; aspect-ratio: 9/16; border-radius: 24px; overflow: hidden; border: 1px solid var(--border-strong); background: #060608; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-lg), 0 0 0 1px rgba(198, 249, 74, 0.06); }
    .preview-frame img { width: 100%; height: 100%; object-fit: contain; }
    .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 16px 0; }
    @media (max-width: 560px) { .controls-grid { grid-template-columns: 1fr; } }
    .check-row { display: flex; gap: 20px; margin: 14px 0; flex-wrap: wrap; }
    .check-label { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; font-weight: 500; }
    .check-label input { width: auto; cursor: pointer; accent-color: var(--accent); }
    .color-input-wrap { display: flex; align-items: center; gap: 8px; }
    .color-input-wrap input[type="color"] { width: 40px; height: 34px; padding: 2px; border-radius: var(--radius-sm); cursor: pointer; border: 1px solid var(--border); background: none; }
    .preset-selector { display: flex; flex-wrap: wrap; gap: 8px; }
  </style>
</head>
<body>
  <header class="topbar">
    <a href="/" class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24"><path d="M4 4.5l10 7.5-10 7.5V4.5zm8 0l10 7.5-10 7.5V4.5z"/></svg>
      </div>
      <h1>SpectreMotion</h1>
    </a>
    <nav class="nav-links">
      <a href="/" class="nav-link">Generator</a>
      <a href="/history" class="nav-link">Riwayat</a>
      <a href="/hook-studio" class="nav-link active">Hook Studio</a>
    </nav>
  </header>

  <main>
    <div class="page-head reveal">
      <h1 class="page-title">Hook Studio</h1>
      <p class="page-desc">Atur tampilan hook &amp; subtitle. Perubahan tersimpan ke template aktif.</p>
    </div>

    <div class="studio-layout">
      <div style="display: flex; flex-direction: column; gap: 16px;">
        <section class="card reveal" style="--reveal-delay:60ms">
          <div class="card-header"><h2>Preset</h2></div>
          <div id="presets-box" class="preset-selector"></div>
        </section>

        <section class="card reveal" style="--reveal-delay:120ms">
          <div class="card-header"><h2>Teks &amp; gaya</h2></div>

          <div class="field">
            <label for="hook-text">Teks contoh (pakai <code>*kata*</code> untuk highlight)</label>
            <textarea id="hook-text" rows="2">CONTOH *HOOK VIRAL* UNTUK KONTENMU</textarea>
          </div>

          <div class="controls-grid">
            <div class="field">
              <label for="font-size">Ukuran font</label>
              <input type="number" id="font-size" value="64" min="30" max="120" />
            </div>
            <div class="field">
              <label for="box-radius">Radius kotak</label>
              <input type="number" id="box-radius" value="18" min="0" max="50" />
            </div>
            <div class="field">
              <label for="font-color">Warna teks</label>
              <div class="color-input-wrap">
                <input type="color" id="font-color" value="#ffffff" />
                <span id="font-color-hex" class="mono">#ffffff</span>
              </div>
            </div>
            <div class="field">
              <label for="highlight-color">Warna highlight</label>
              <div class="color-input-wrap">
                <input type="color" id="highlight-color" value="#c6f94a" />
                <span id="highlight-color-hex" class="mono">#c6f94a</span>
              </div>
            </div>
          </div>

          <div class="check-row">
            <label class="check-label">
              <input type="checkbox" id="box-on" checked />
              Kotak latar (bubble)
            </label>
            <label class="check-label">
              <input type="checkbox" id="stroke-on" />
              Outline teks
            </label>
          </div>

          <div style="display: flex; gap: 12px; margin-top: 16px; align-items: center; flex-wrap: wrap;">
            <button type="button" class="btn" id="btn-save" onclick="saveTemplate()">Simpan template</button>
            <button type="button" class="btn btn-secondary" id="btn-refresh" onclick="updatePreview()">Perbarui preview</button>
            <span id="save-msg" class="card-desc"></span>
          </div>
        </section>
      </div>

      <div class="preview-card card reveal" style="--reveal-delay:180ms">
        <h3 style="margin: 0; font-size: 14px; font-weight: 500;">Pratinjau 9:16</h3>
        <div class="preview-frame">
          <img id="preview-img" src="" alt="Preview" />
        </div>
      </div>
    </div>
  </main>

  <script>
    function hexClean(val, def) {
      if (!val) return def;
      val = val.split('@')[0];
      return val.startsWith('#') ? val : '#' + val;
    }

    async function loadPresets() {
      try {
        const res = await fetch('/api/presets');
        const list = await res.json();
        document.getElementById('presets-box').innerHTML = list.map(p =>
          `<button type="button" class="btn btn-sm btn-secondary" onclick="applyPreset('${p.id}')">${p.name}</button>`
        ).join('');
      } catch (err) { console.error(err); }
    }

    async function loadTemplate() {
      try {
        const res = await fetch('/api/template');
        const data = await res.json();
        const hook = data.hook || {};
        const sub = data.subtitle || {};
        document.getElementById('font-size').value = hook.font_size || 64;
        document.getElementById('font-color').value = hexClean(hook.font_color, '#ffffff');
        document.getElementById('font-color-hex').textContent = document.getElementById('font-color').value;
        document.getElementById('highlight-color').value = hexClean(hook.highlight_color || sub.highlight_color, '#c6f94a');
        document.getElementById('highlight-color-hex').textContent = document.getElementById('highlight-color').value;
        document.getElementById('box-radius').value = hook.box_radius || 18;
        document.getElementById('box-on').checked = (hook.box !== false);
        document.getElementById('stroke-on').checked = (hook.stroke_w > 0);
        updatePreview();
      } catch (err) { console.error(err); }
    }

    async function applyPreset(presetId) {
      try {
        const preset = await (await fetch('/api/preset/' + presetId)).json();
        const cur = await (await fetch('/api/template')).json();
        const merged = Object.assign({}, cur, preset);
        const hook = merged.hook || {};
        const sub = merged.subtitle || {};
        if (hook.font_size) document.getElementById('font-size').value = hook.font_size;
        if (hook.font_color) document.getElementById('font-color').value = hexClean(hook.font_color, '#ffffff');
        if (hook.highlight_color) document.getElementById('highlight-color').value = hexClean(hook.highlight_color, '#c6f94a');
        if (hook.box_radius) document.getElementById('box-radius').value = hook.box_radius;
        document.getElementById('box-on').checked = (hook.box !== false);
        document.getElementById('stroke-on').checked = ((hook.stroke_w || 0) > 0);
        document.getElementById('font-color-hex').textContent = document.getElementById('font-color').value;
        document.getElementById('highlight-color-hex').textContent = document.getElementById('highlight-color').value;
        document.getElementById('save-msg').textContent = 'Preset ' + presetId + ' dipilih. Klik Simpan untuk menerapkan.';
        updatePreview();
      } catch (err) { console.error(err); }
    }

    function collectForm() {
      return {
        font_size: parseInt(document.getElementById('font-size').value, 10) || 64,
        font_color: document.getElementById('font-color').value,
        highlight_color: document.getElementById('highlight-color').value,
        box_radius: parseInt(document.getElementById('box-radius').value, 10) || 18,
        box: document.getElementById('box-on').checked,
        stroke_w: document.getElementById('stroke-on').checked ? 3 : 0,
        stroke_color: '#000000'
      };
    }

    let previewDebounce = null;
    function queuePreview() { clearTimeout(previewDebounce); previewDebounce = setTimeout(updatePreview, 250); }

    async function updatePreview() {
      const hookCfg = collectForm();
      const text = document.getElementById('hook-text').value;
      try {
        const res = await fetch('/api/template/preview', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: text, hook: hookCfg })
        });
        if (res.ok) {
          const blob = await res.blob();
          document.getElementById('preview-img').src = URL.createObjectURL(blob);
        }
      } catch (err) { console.error('Preview error:', err); }
    }

    async function saveTemplate() {
      const msg = document.getElementById('save-msg');
      msg.textContent = 'Menyimpan...';
      try {
        const tmpl = await (await fetch('/api/template')).json();
        const hookCfg = collectForm();
        tmpl.hook = Object.assign({}, tmpl.hook, hookCfg);
        tmpl.subtitle = Object.assign({}, tmpl.subtitle, { highlight_color: hookCfg.highlight_color });
        const res = await fetch('/api/template', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(tmpl)
        });
        if (res.ok) { msg.textContent = 'Tersimpan.'; setTimeout(() => { msg.textContent = ''; }, 3000); }
        else msg.textContent = 'Gagal menyimpan.';
      } catch (err) { msg.textContent = err.message; }
    }

    document.getElementById('hook-text').addEventListener('input', queuePreview);
    ['font-size', 'box-radius'].forEach(id => document.getElementById(id).addEventListener('input', queuePreview));
    ['box-on', 'stroke-on'].forEach(id => document.getElementById(id).addEventListener('change', queuePreview));
    document.getElementById('font-color').addEventListener('input', (e) => {
      document.getElementById('font-color-hex').textContent = e.target.value; queuePreview();
    });
    document.getElementById('highlight-color').addEventListener('input', (e) => {
      document.getElementById('highlight-color-hex').textContent = e.target.value; queuePreview();
    });

    loadPresets();
    loadTemplate();

    const io = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) { entry.target.classList.add('in'); io.unobserve(entry.target); }
      });
    }, { threshold: 0.08 });
    document.querySelectorAll('.reveal').forEach((el) => io.observe(el));
  </script>
</body>
</html>
