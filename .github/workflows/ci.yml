name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check
        run: python -m compileall app

      - name: Migrations status
        run: python -m app.db.migrate status

      - name: Run tests (hermetic, includes real ffmpeg render smoke)
        env:
          LLM_DRIVER: fake
          TRANSCRIBER_DRIVER: fake
        run: pytest -q

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t spectremotion:ci .

  # OPTIONAL: run the worker inside Actions for offline/batch renders.
  # Actions runners cannot accept inbound connections, so this is a one-shot
  # batch render, NEVER a web server.
  render-batch:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Process queued jobs (one-shot, hermetic fake analysis)
        env:
          LLM_DRIVER: ${{ vars.LLM_DRIVER || 'fake' }}
          TRANSCRIBER_DRIVER: fake
          WHISPER_MODEL: base
        run: python -m app.worker --once
